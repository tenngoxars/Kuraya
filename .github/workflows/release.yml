# 发布流水线：打 tag 即发布。
#
# 用法：
#   1. 改 kuraya/__init__.py 的 __version__（同步 packaging/version_info.txt）并提交推送
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# 流水线自动完成：
#   校验 tag 与版本一致（三个构建 job 都会跑 check_tag.py）
#   → 构建 mac-arm64 / linux-x86_64 / win-x64 三个 zip
#   → 建 GitHub Release 附 zip，说明里给出各 zip 的 SHA256
#   → 若仓库配置了 TAP_TOKEN secret，自动更新 tap 仓库的 formula；
#     没配则手动改 packaging/homebrew/kuraya.rb 后推送
#
# 注：mac 仅 Apple Silicon——GitHub 已退役 Intel macOS runner
# （macos-13 于 2026 年下线，macos-14/15 均为 arm64）；如需 Intel 包
# 须在 Intel 机器上手动构建上传。

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------- 三平台构建 ----------
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 校验 tag 与版本号一致
        run: python packaging/check_tag.py "$GITHUB_REF_NAME"
      - name: 构建并打包
        run: ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dist/Kuraya-*-mac-arm64.zip

  # 注：GitHub 已退役 Intel macOS runner（macos-13 于 2026 年下线，macos-14/15
  # 均为 Apple Silicon），mac 仅支持 arm64；如需 Intel 包需手动在 Intel 机器构建

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 校验 tag 与版本号一致
        run: python packaging/check_tag.py "$GITHUB_REF_NAME"
      # ubuntu runner 默认不带 zip 命令，release.sh 打包需要它
      - name: 安装 zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip
      - name: 构建并打包
        run: ./release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/Kuraya-*-linux-x86_64.zip

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 校验 tag 与版本号一致
        shell: pwsh
        run: python packaging/check_tag.py $env:GITHUB_REF_NAME
      # 构建与打包复用 release.bat（含 zip 命名与 SHA256），与本地发布完全一致
      - name: 构建并打包
        run: cmd /c "release.bat nopause"
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/Kuraya-*-win-x64.zip

  # ---------- 建 Release ----------
  release:
    needs: [build-mac-arm64, build-linux, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: 生成发布说明
        run: |
          {
            echo "## 安装"
            echo '```bash'
            echo "brew install tenngoxars/tap/kuraya"
            echo '```'
            echo ""
            echo "## 各平台包 SHA256（更新 tap formula 时用）"
            echo '```'
            for f in release-assets/*/*.zip; do
              echo "$(shasum -a 256 "$f" | cut -d' ' -f1)  $(basename "$f")"
            done
            echo '```'
          } > NOTES.md
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-assets/*/*.zip \
            --title "Kuraya $VER" --notes-file NOTES.md

  # ---------- 可选：自动更新 tap 公式 ----------
  # 配了 TAP_TOKEN（能推 homebrew-tap 仓库的 PAT）时自动更新 formula；
  # 没配则手动：按 Release 说明里的 SHA256 改 packaging/homebrew/kuraya.rb 后推送。
  # mac 仅 Apple Silicon（GitHub 已无 Intel macOS runner），只填 on_arm 块。
  # 注：job 级 if 不能读 secrets（会直接报错），改经 job env 传值、step 级判断
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: 未配置 TAP_TOKEN 时跳过
        if: env.TAP_TOKEN == ''
        run: echo "未配置 TAP_TOKEN，跳过 tap 更新（手动更新 packaging/homebrew/kuraya.rb）"
      - if: env.TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: tenngoxars/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
      - if: env.TAP_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64
      - name: 更新 formula 并推送
        if: env.TAP_TOKEN != ''
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          URL="https://github.com/tenngoxars/Kuraya/releases/download/${VERSION}/Kuraya-${VER}-mac-arm64.zip"
          SHA=$(shasum -a 256 mac-arm64/*.zip | cut -d' ' -f1)
          # version 由 URL 自动推断，只需替换顶层 url/sha256 两行
          sed -i "s|url \".*\"|url \"$URL\"|; s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/kuraya.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kuraya.rb
          git commit -m "kuraya $VER"
          git push
