# 复制本文件为「设置.ini」后填写，程序只读取「设置.ini」。
# 设置.ini 已被 .gitignore 排除，不会随代码提交。

[路径]
# 【必填】影片库目录：整理好的影片存放位置，也是网页生成的位置。
# 例：D:\Media\Library
影片库目录 =

# 【选填】待整理目录：待刮削的新片放这里。留空则默认为「影片库目录\待整理」。
# 例：E:\下载\新片
待整理目录 =

# 【选填】播放器：点击片库页面的封面时用它打开。留空则用系统默认程序。
# 首次运行会自动探测常见播放器，装在非默认位置时需在此指定。
# 例：D:\apps\PotPlayer\PotPlayerMini64.exe
播放器 =

[刮削]
# 【选填】间隔秒数：每处理完一部影片后歇多久再处理下一部，默认 3。
# 调小会加快批量入库，但请求过密可能被数据源限流。填 0 表示不等待。
间隔秒数 = 3
