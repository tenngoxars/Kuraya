<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURAYA 蔵屋 — 官网原型预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #111; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* 原型切换条：固定底部居中，刻意与被评估设计拉开对比 */
  #switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px;
    background: #1c1c22; color: #e8e8ee; border: 1px solid #3a3a46;
    border-radius: 999px; padding: 6px 8px;
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    z-index: 9999; user-select: none;
  }
  #switcher .proto-tag {
    font-size: 10px; letter-spacing: .12em; color: #7a7a8a;
    padding: 0 8px; border-right: 1px solid #3a3a46; margin-right: 4px;
  }
  #switcher button {
    width: 30px; height: 30px; border-radius: 50%;
    border: 0; background: transparent; color: #e8e8ee;
    font-size: 15px; cursor: pointer; line-height: 1;
  }
  #switcher button:hover { background: #34343f; }
  #switcher #label { min-width: 190px; text-align: center; white-space: nowrap; }
  #switcher #label b { color: #8ab4ff; }
</style>
</head>
<body>
<iframe id="frame" title="官网原型"></iframe>

<div id="switcher">
  <span class="proto-tag">PROTOTYPE</span>
  <button id="prev" aria-label="上一个方案">&#8592;</button>
  <span id="label"></span>
  <button id="next" aria-label="下一个方案">&#8594;</button>
</div>

<script>
  // 方案清单：key → [文件, 名称]
  const VARIANTS = {
    a: ['variant-a.html', '蔵 · 日式藏屋美学'],
    b: ['variant-b.html', '终端 · 开发者工具风'],
    c: ['variant-c.html', '明快 · 现代产品页'],
  };
  const KEYS = Object.keys(VARIANTS);

  const frame = document.getElementById('frame');
  const label = document.getElementById('label');

  function current() {
    const v = new URLSearchParams(location.search).get('variant');
    return VARIANTS[v] ? v : 'a';
  }

  function show(key, push = true) {
    const [file, name] = VARIANTS[key];
    frame.src = file;
    label.innerHTML = `<b>${key.toUpperCase()}</b> — ${name}`;
    if (push) {
      const url = new URL(location.href);
      url.searchParams.set('variant', key);
      history.replaceState(null, '', url);
    }
  }

  function step(dir) {
    const i = KEYS.indexOf(current());
    show(KEYS[(i + dir + KEYS.length) % KEYS.length]);
  }

  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);

  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  // 子页面（iframe 内）冒泡上来的方向键
  addEventListener('message', e => {
    if (e.data && e.data.type === 'proto-nav') step(e.data.dir);
  });

  addEventListener('popstate', () => show(current(), false));
  show(current(), false);
</script>
</body>
</html>
