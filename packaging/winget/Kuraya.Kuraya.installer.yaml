# winget 安装程序清单
# 提交前需替换：<VERSION>、<DOWNLOAD_URL>、<SHA256>
# SHA256 由 release.bat 生成，见 dist/SHA256.txt

PackageIdentifier: Kuraya.Kuraya
PackageVersion: <VERSION>
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: Kuraya.exe
    PortableCommandAlias: kuraya
Installers:
  - Architecture: x64
    InstallerUrl: <DOWNLOAD_URL>
    InstallerSha256: <SHA256>
ManifestType: installer
ManifestVersion: 1.6.0
