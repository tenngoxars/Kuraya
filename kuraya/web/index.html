<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuraya</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>%20<rect width='24' height='24' rx='5' fill='%230d0e11'/>%20<g fill='none' stroke='%23c9a227' stroke-width='1.1' stroke-linejoin='miter'>%20<circle cx='12' cy='12' r='9.2' opacity='.45'/>%20<path d='M12 3.8L20.2 12 12 20.2 3.8 12z'/>%20<path d='M12 9.2l2.8 2.8-2.8 2.8-2.8-2.8z' fill='%23c9a227' stroke='none'/>%20</g>%20</svg>">
<style>
{{STYLE}}
</style>
</head>
<body>

<main id="pageContent">
<div class="masthead">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.2"/>
        <path d="M12 3.8L20.2 12 12 20.2 3.8 12z"/>
        <path class="mark-core" d="M12 9.2l2.8 2.8-2.8 2.8-2.8-2.8z"/>
      </svg>
    </span>
    <h1>KURAYA</h1>
    <span class="brand-kanji">蔵屋</span>
    <span class="brand-rule"></span>
    <span class="eyebrow">Private Collection</span>
  </div>
  <div class="stats">
    <div><span class="stat-num">{{COUNT}}</span><span class="stat-lbl" data-i18n="stat.movies">部影片</span></div>
  </div>
  <div class="langs" id="langs"></div>
</div>

<div class="sticky-block">
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" data-i18n-placeholder="search.placeholder"
             placeholder="搜索演员 · 番号 · 发行商 · 导演">
      <button class="clear-btn" id="clearBtn" type="button" data-i18n-aria="clear" aria-label="清空">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="select-wrap" id="sortWrap">
      <button type="button" class="select-btn" id="sortBtn"
              aria-haspopup="listbox" aria-expanded="false">
        <span id="sortLabel" data-i18n="sort.date_desc">发行日期 · 新到旧</span>
        <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none"
             stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg>
      </button>
      <div class="select-menu" id="sortMenu" role="listbox" data-i18n-aria="sort.by" aria-label="排序方式">
        <button type="button" class="select-opt" role="option" aria-selected="true"
                data-value="date_desc" data-i18n="sort.date_desc">发行日期 · 新到旧</button>
        <button type="button" class="select-opt" role="option" aria-selected="false"
                data-value="date_asc" data-i18n="sort.date_asc">发行日期 · 旧到新</button>
        <button type="button" class="select-opt" role="option" aria-selected="false"
                data-value="added_desc" data-i18n="sort.added_desc">入库时间 · 新到旧</button>
      </div>
    </div>
    <div class="pills" id="pills"></div>
    <span id="count"></span>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="grid" id="grid"></div>
<div id="sentinel"></div>
</main>

<div class="confirm-modal" id="confirmModal" hidden>
  <div class="confirm-backdrop"></div>
  <section class="confirm-dialog" role="dialog" aria-modal="true"
           aria-labelledby="confirmTitle"
           aria-describedby="confirmDescription confirmNote confirmTarget">
    <div class="confirm-head">
      <div class="confirm-symbol" aria-hidden="true">
        <svg width="15" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
        </svg>
      </div>
      <h2 id="confirmTitle" data-i18n="delete.title">移入废纸篓</h2>
      <button class="confirm-close" id="confirmClose" type="button"
              data-i18n-aria="delete.close" aria-label="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <p class="confirm-copy" id="confirmDescription"></p>
    <p class="confirm-note" id="confirmNote"></p>
    <div class="confirm-target" id="confirmTarget"></div>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancel" type="button"
              data-i18n="delete.cancel">取消</button>
      <button class="confirm-submit" id="confirmSubmit" type="button">
        <svg width="13" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
        </svg>
        <span data-i18n="delete.action">移入废纸篓</span>
      </button>
    </div>
  </section>
</div>

<script>
{{SCRIPT}}
</script>
</body>
</html>
